<text x="680" y="628" class="cap">VM 1 to VM 2: routed on the Tier-1, which holds the gateway IP (/32)</text>
<text x="680" y="647" class="cap">and a static route per migrated VM. Not advertised to the source.</text>
<circle cx="662" cy="662" r="10" fill="#7c3aed"/>
<text x="662" y="666.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="680" y="666" class="cap">Destinations that match an Allow policy route (default: RFC 1918, not</text>
<text x="680" y="685" class="cap">in the SDDC): through the extension to the source gateway.</text>
<circle cx="662" cy="700" r="10" fill="#2563eb"/>
<text x="662" y="704.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="680" y="704" class="cap">Everything else, such as Internet egress: out through the Tier-0.</text>
<text x="40" y="748" font-size="12.5" fill="#334155">Bulk-migrated VMs get MON automatically. HCX vMotion and RAV-migrated VMs, and VMs that were on the network before MON was turned on,</text>
<text x="40" y="767" font-size="12.5" fill="#334155">keep the source gateway until their Router Location is set to the cloud Tier-1. No MON to an NSX VLAN segment, a VPC subnet or a vSphere DVPG.</text>
