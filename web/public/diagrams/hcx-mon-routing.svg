<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 800" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">HCX network extension without and with Mobility Optimized Networking</title>
<desc id="d">HCX network extension without and with Mobility Optimized Networking (MON), side by side. In both panels the legacy (source) site is on the left with the source gateway and its HCX Network Extension appliance, and the VCF 9.1 (destination) site on the right with Tier-0, Tier-1, its Network Extension appliance and two migrated VMs, VM 1 on extended network A and VM 2 on extended network B. The two NE appliances are joined by the L2 extension. Without MON every routed flow of a migrated VM goes back through the extension to the source gateway: VM 1 to VM 2 on another extended network goes to the source gateway and back (tromboning), and Internet traffic leaves at the source. With MON, HCX enables the gateway IP on the Tier-1 with a /32 mask and adds a static route per migrated VM: VM 1 to VM 2 is routed locally on the Tier-1; traffic to networks that match an Allow policy route (by default the RFC 1918 ranges, when the destination is not in the SDDC) goes through the extension to the source gateway; everything else, such as Internet egress, goes out through the Tier-0. Bulk-migrated VMs get MON automatically; HCX vMotion and RAV-migrated VMs keep the source gateway until their Router Location is set to the cloud.</desc>
