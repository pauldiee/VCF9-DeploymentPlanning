<text x="80" y="628" class="cap">VM 1 to VM 2 on another extended network: through the extension to the</text>
<text x="80" y="647" class="cap">source gateway and back again (tromboning).</text>
<circle cx="62" cy="662" r="10" fill="#475569"/>
