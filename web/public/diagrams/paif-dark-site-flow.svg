<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Private AI Foundation dark-site build flow</title>
<desc id="d">Five parallel lanes, phases 3 to 7. Each lane pulls from an internet source on the bastion host, is carried across the air gap, and is pushed by the admin host into Harbor, a web server or a vCenter content library.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
