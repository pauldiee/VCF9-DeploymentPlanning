<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 902" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Private AI Foundation dark-site build flow</title>
<desc id="d">Six lanes. Each pulls from an internet source on the bastion host, is carried across the air gap in one of three carries (1 tooling, 2 content, 3 Private AI Services), and is pushed or installed by the admin host into Harbor, a web server, a vCenter content library or the admin host itself.</desc>
