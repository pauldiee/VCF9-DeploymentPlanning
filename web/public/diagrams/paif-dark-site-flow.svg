<text x="562" y="42" font-size="16" font-weight="700" fill="#14532d">INSIDE - air-gapped</text>
<text x="262" y="72" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Bastion host</text>
<text x="708" y="72" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Admin host</text>
<line x1="530" y1="14" x2="530" y2="654" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="530" y="676" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">AIR GAP - carry: removable media, data diode or a temporary firewall opening</text>
<circle cx="34" cy="124" r="12" fill="#334155"/><text x="34" y="129" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="54" y="92" width="150" height="64" rx="6" fill="#ffffff" stroke="#94a3b8"/>
