<circle cx="860" cy="106" r="12" fill="#0f172a"/>
<text x="860" y="111" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="880" y="111" font-size="15.5" font-weight="700" fill="#0f172a">Unextend + Connect</text>
<text x="880" y="130" font-size="12" fill="#475569">Connect cloud network to cloud edge gateway</text>
<rect x="848" y="146" width="150" height="340" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="923.0" y="165" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Legacy site</text>
<rect x="1012" y="146" width="196" height="340" rx="8" fill="#f0fdf4" stroke="#86efac"/>
<text x="1110.0" y="165" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">VCF 9.1 site</text>
<rect x="858" y="180" width="130" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="923.0" y="205.0" class="bt" style="fill:#64748b">Source gateway</text>
<text x="923.0" y="221.0" class="bs">interface shut first</text>
<rect x="858" y="334" width="130" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="923.0" y="362.0" class="bt" style="fill:#0f172a">NE appliance</text>
<rect x="858" y="410" width="130" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
