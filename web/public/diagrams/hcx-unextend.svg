<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 720" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Unextending an HCX network: the three states</title>
<desc id="d">Unextending an HCX network extension, three states side by side, for example network 10.10.20.0/24 with gateway 10.10.20.1. 1, extended: the source gateway holds 10.10.20.1 and advertises the subnet; the NE appliances bridge the network at layer 2; on the VCF 9.1 side the NSX segment exists but its Tier-1 router interface is disconnected (with MON only a /32), so the migrated VMs reach their gateway through the extension. 2, unextend with the default setting: the L2 path is removed; the segment and its Tier-1 interface stay but the interface stays disconnected, so the VMs on the target have no gateway until someone connects it in NSX; the source gateway still advertises the subnet, so there is no routing conflict. 3, unextend with Connect cloud network to cloud edge gateway after unextending: the source gateway was shut first; HCX connects the segment to the Tier-1, which now holds 10.10.20.1/24, and with dynamic routing the subnet is advertised from the Tier-1 through the Tier-0. Unextending removes the L2 bridged path, never the NSX segment, port group or NSX interface.</desc>
<defs>
