<text x="54" y="510" class="cap" style="fill:#334155">The gateway exists only at the source.</text>
<text x="54" y="528" class="cap" style="fill:#334155">Migrated VMs reach it over the L2</text>
<text x="54" y="546" class="cap" style="fill:#334155">extension. The Tier-1 interface of the</text>
<text x="54" y="564" class="cap" style="fill:#334155">segment is disconnected (with MON:</text>
<text x="54" y="582" class="cap" style="fill:#334155">a /32 and per-VM routes only).</text>
<text x="54" y="600" class="cap" style="fill:#2563eb">Subnet advertised by: the source.</text>
