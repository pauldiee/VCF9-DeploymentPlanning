<path d="M923.0 380 L923.0 410" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="1024" y="180" width="172" height="40" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
<text x="1110.0" y="205.0" class="bt" style="fill:#0f172a">Tier-0</text>
<path d="M1110.0 220 L1110.0 246" fill="none" stroke="#22c55e" stroke-width="2"/>
<rect x="1024" y="246" width="172" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1110.0" y="271.0" class="bt" style="fill:#0f172a">Tier-1</text>
<text x="1110.0" y="287.0" class="bs">holds 10.10.20.1/24</text>
<rect x="1024" y="334" width="122" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1085.0" y="362.0" class="bt" style="fill:#0f172a">NE appliance</text>
<rect x="1024" y="410" width="172" height="50" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
<text x="1110.0" y="432.0" class="bt" style="fill:#0f172a">NSX segment</text>
<text x="1110.0" y="448.0" class="bs">VM 1, VM 2 (migrated)</text>
<path d="M1168 302 L1168 410" fill="none" stroke="#15803d" stroke-width="3"/>
<text transform="translate(1184 356) rotate(-90)" font-size="11" fill="#15803d" text-anchor="middle">connected</text>
<line x1="1052" y1="380" x2="1052" y2="410" stroke="#94a3b8" stroke-width="2"/>
<path d="M998.0 349 L1014.0 365 M1014.0 349 L998.0 365" stroke="#dc2626" stroke-width="3"/>
<text x="1006.0" y="343" font-size="11.5" fill="#dc2626" text-anchor="middle">L2</text>
<text x="850" y="510" class="cap" style="fill:#334155">Shut the source gateway first. HCX</text>
<text x="850" y="528" class="cap" style="fill:#334155">removes the L2 path and connects the</text>
<text x="850" y="546" class="cap" style="fill:#334155">segment to the Tier-1, which now holds</text>
<text x="850" y="564" class="cap" style="fill:#334155">10.10.20.1/24 for the migrated VMs.</text>
<text x="850" y="582" class="cap" style="fill:#334155">With dynamic routing (BGP or OSPF):</text>
<text x="850" y="600" class="cap" style="fill:#15803d">Subnet advertised by: the Tier-1.</text>
<text x="40" y="654" font-size="12.5" fill="#334155">Pick state 3 in the cutover window. State 2 is for when the source gateway must keep the subnet (VMs still there, routing not ready):</text>
<text x="40" y="673" font-size="12.5" fill="#334155">the migrated VMs are then isolated until the interface is connected in NSX. Never let both sides hold and advertise 10.10.20.1 at the same time.</text>
<text x="40" y="692" font-size="12.5" fill="#334155">The L2 path cannot be restored by turning the source gateway back on: rolling back after the unextend means a new extension.</text>
</svg>
