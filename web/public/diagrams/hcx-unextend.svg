<path d="M712.0 220 L712.0 246" fill="none" stroke="#22c55e" stroke-width="2"/>
<rect x="626" y="246" width="172" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
<text x="712.0" y="271.0" class="bt" style="fill:#0f172a">Tier-1</text>
<text x="712.0" y="287.0" class="bs">no gateway for this subnet</text>
<rect x="626" y="334" width="122" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="687.0" y="362.0" class="bt" style="fill:#0f172a">NE appliance</text>
<rect x="626" y="410" width="172" height="50" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
<text x="712.0" y="432.0" class="bt" style="fill:#0f172a">NSX segment</text>
<text x="712.0" y="448.0" class="bs">VM 1, VM 2 (migrated)</text>
<path d="M770 302 L770 410" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4 4"/>
<text transform="translate(786 356) rotate(-90)" font-size="11" fill="#dc2626" text-anchor="middle">disconnected</text>
<line x1="654" y1="380" x2="654" y2="410" stroke="#94a3b8" stroke-width="2"/>
<path d="M600.0 349 L616.0 365 M616.0 349 L600.0 365" stroke="#dc2626" stroke-width="3"/>
<text x="608.0" y="343" font-size="11.5" fill="#dc2626" text-anchor="middle">L2</text>
<text x="452" y="510" class="cap" style="fill:#334155">HCX removes the L2 path only. The</text>
<text x="452" y="528" class="cap" style="fill:#334155">segment stays, its Tier-1 interface</text>
<text x="452" y="546" class="cap" style="fill:#334155">stays disconnected: VMs on the target</text>
<text x="452" y="564" class="cap" style="fill:#dc2626">have no gateway until you connect it.</text>
<text x="452" y="582" class="cap" style="fill:#334155">No routing conflict with the source.</text>
<text x="452" y="600" class="cap" style="fill:#2563eb">Subnet advertised by: the source.</text>
