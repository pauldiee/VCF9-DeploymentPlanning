<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 800" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">VCF Operations HCX firewall flows between the legacy side and the VCF 9.1 side</title>
<desc id="d">Legacy (source) side on the left, VCF 9.1 (destination) side on the right. Across the sites: source HCX Manager to destination HCX Manager on 443 for the site pair, source IX and NE uplinks to destination IX and NE uplinks on UDP 4500 for the tunnels, and optionally UDP 4500 to 4628 to 4500 for Application Path Resiliency. Within each site: HCX Manager to vCenter and NSX Manager on 443, HCX Manager to ESX on 443, 80 and 902, IX to ESX vMotion IPs on 8000, ESX to IX on 902, 31031 and 32032, and admin workstation to HCX Manager on 443, 9443 and 22. On the VCF 9.1 side the HCX Manager also reaches the VCF Identity Broker and License Server on 443.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
<style>
.lbl{font-size:13px;fill:#0f172a;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.box{fill:#ffffff;stroke-width:1.8}
.bt{font-size:14px;fill:#0f172a;text-anchor:middle}
.bs{font-size:12px;fill:#475569;text-anchor:middle}
.mg{fill:none;stroke:#475569;stroke-width:2}
.dash{stroke-dasharray:7 5}
</style>
</defs>
<rect width="1260" height="800" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="630" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">VCF Operations HCX: firewall flows between the two sites</text>
<text x="630" y="60" font-size="13" fill="#475569" text-anchor="middle">Arrows point from source to destination. Port numbers are TCP unless stated otherwise.</text>

<!-- site panels -->
<rect x="15" y="80" width="485" height="575" rx="8" fill="#dbeafe" fill-opacity="0.35" stroke="#3b82f6" stroke-opacity="0.5"/>
<text x="32" y="108" font-size="16" font-weight="700" fill="#0f172a">Legacy side (source)</text>
<rect x="760" y="80" width="485" height="575" rx="8" fill="#dcfce7" fill-opacity="0.35" stroke="#22c55e" stroke-opacity="0.5"/>
<text x="1228" y="108" font-size="16" font-weight="700" fill="#0f172a" text-anchor="end">VCF 9.1 side (destination)</text>
<text x="630" y="108" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">between the sites</text>

<!-- ===== lines (drawn first, boxes on top) ===== -->
<!-- cross-site: site pair -->
<path class="mg" d="M470 305 H788" marker-end="url(#a)"/>
<text class="lbl" x="630" y="297" text-anchor="middle">443 site pair</text>
<!-- cross-site: tunnels -->
<path d="M470 432 H784" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#o)"/>
<text class="lbl" x="630" y="417" text-anchor="middle" font-weight="700" style="fill:#c2410c">UDP 4500 tunnels (IKEv2)</text>
<!-- cross-site: APR -->
<path class="mg dash" d="M470 462 H788" marker-end="url(#a)"/>
<text class="lbl" x="630" y="488" text-anchor="middle">UDP 4500–4628 to 4500, optional</text>
<text class="lbl" x="630" y="506" text-anchor="middle">Application Path Resiliency</text>

<!-- legacy side, intra -->
<path class="mg" d="M380 270 V192" marker-end="url(#a)"/>
<text class="lbl" x="388" y="236">443</text>
<path class="mg" d="M190 305 H268" marker-end="url(#a)"/>
<text class="lbl" x="229" y="296" text-anchor="middle">443, 9443, 22</text>
<path class="mg" d="M285 340 V568" marker-end="url(#a)"/>
<text class="lbl" x="277" y="460" text-anchor="end">443, 80, 902</text>
<path class="mg" d="M345 480 V568" marker-end="url(#a)"/>
<text class="lbl" x="353" y="528">8000 vMotion</text>
<path class="mg" d="M445 570 V482" marker-end="url(#a)"/>
<text class="lbl" x="453" y="545">902, 31031, 32032</text>

<!-- VCF 9.1 side, intra -->
<path class="mg" d="M880 270 V192" marker-end="url(#a)"/>
<text class="lbl" x="888" y="236">443</text>
<path class="mg" d="M1070 305 H992" marker-end="url(#a)"/>
<text class="lbl" x="1031" y="296" text-anchor="middle">443, 9443, 22</text>
<path class="mg" d="M975 340 V568" marker-end="url(#a)"/>
<text class="lbl" x="983" y="460">443, 80, 902</text>
<path class="mg" d="M915 480 V568" marker-end="url(#a)"/>
<text class="lbl" x="907" y="528" text-anchor="end">8000 vMotion</text>
<path class="mg" d="M815 570 V482" marker-end="url(#a)"/>
<text class="lbl" x="807" y="545" text-anchor="end">902, 31031, 32032</text>
<path class="mg" d="M975 270 V160 H1068" marker-end="url(#a)"/>
<text class="lbl" x="1022" y="152" text-anchor="middle">443</text>

<!-- ===== boxes ===== -->
<!-- legacy side -->
<rect class="box" x="290" y="132" width="180" height="58" rx="7" stroke="#3b82f6"/>
<text class="bt" x="380" y="157" font-weight="700">vCenter, NSX Manager</text>
<text class="bs" x="380" y="176">NSX optional</text>
<rect class="box" x="270" y="270" width="200" height="70" rx="7" stroke="#3b82f6"/>
<text class="bt" x="370" y="299" font-weight="700">HCX Manager</text>
<text class="bs" x="370" y="318">Connector, starts pair and tunnels</text>
<rect class="box" x="320" y="410" width="150" height="70" rx="7" stroke="#3b82f6"/>
<text class="bt" x="395" y="434" font-weight="700">HCX-IX</text>
<text class="bt" x="395" y="452" font-weight="700">HCX-NET-EXT</text>
<text class="bs" x="395" y="470">service mesh</text>
<rect class="box" x="270" y="570" width="200" height="60" rx="7" stroke="#3b82f6"/>
<text class="bt" x="370" y="596" font-weight="700">ESX hosts</text>
<text class="bs" x="370" y="614">workloads to migrate</text>
<rect class="box" x="30" y="270" width="160" height="70" rx="7" stroke="#94a3b8"/>
<text class="bt" x="110" y="300">Admin workstation</text>
<text class="bs" x="110" y="319">browser, SSH</text>

<!-- VCF 9.1 side -->
<rect class="box" x="790" y="132" width="180" height="58" rx="7" stroke="#22c55e"/>
<text class="bt" x="880" y="157" font-weight="700">vCenter, NSX Manager</text>
<text class="bs" x="880" y="176">VCF 9.1 domain</text>
<rect class="box" x="790" y="270" width="200" height="70" rx="7" stroke="#22c55e"/>
<text class="bt" x="890" y="299" font-weight="700">HCX Manager</text>
<text class="bs" x="890" y="318">Cloud Manager</text>
<rect class="box" x="790" y="410" width="150" height="70" rx="7" stroke="#22c55e"/>
<text class="bt" x="865" y="434" font-weight="700">HCX-IX</text>
<text class="bt" x="865" y="452" font-weight="700">HCX-NET-EXT</text>
<text class="bs" x="865" y="470">service mesh</text>
<rect class="box" x="790" y="570" width="200" height="60" rx="7" stroke="#22c55e"/>
<text class="bt" x="890" y="596" font-weight="700">ESX hosts</text>
<text class="bs" x="890" y="614">migration target</text>
<rect class="box" x="1070" y="270" width="160" height="70" rx="7" stroke="#94a3b8"/>
<text class="bt" x="1150" y="300">Admin workstation</text>
<text class="bs" x="1150" y="319">browser, SSH</text>
<rect class="box" x="1070" y="132" width="160" height="58" rx="7" stroke="#94a3b8"/>
<text class="bt" x="1150" y="157">VCF Identity Broker</text>
<text class="bt" x="1150" y="177">License Server</text>

<!-- ===== legend ===== -->
<path d="M30 685 H90" fill="none" stroke="#c2410c" stroke-width="5"/>
<text x="102" y="690" font-size="13" fill="#0f172a">Tunnels between the IX and NE uplinks: the source starts them, so the inbound rule sits on the VCF 9.1 side's perimeter</text>
<path class="mg" d="M30 713 H90"/>
<text x="102" y="718" font-size="13" fill="#0f172a">Management and migration</text>
<path class="mg dash" d="M290 713 H350"/>
<text x="362" y="718" font-size="13" fill="#0f172a">Optional</text>
<text x="30" y="748" font-size="13" fill="#0f172a">The flows within a site are the same on both sides, except the VCF Identity Broker and License Server flows on the VCF 9.1 side.</text>
<text x="30" y="776" font-size="12" fill="#475569">Source: Ports and Protocols portal, product VCF Operations HCX (curated subset, see the table in §3.4; pick the listing for your version).</text>
</svg>
