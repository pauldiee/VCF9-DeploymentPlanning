<title id="t">Private AI Foundation dark-site build: order and roles</title>
<desc id="d">Ten columns left to right across five roles. Prepare, hosts with Carry 1, Harbor, then pull on the bastion and push on the admin host (phases 3 to 7 in parallel) with the VKr library, then the steps shared with the connected build: VM classes, region and quota, organization content, Quickstart, install and activate Private AI Services.</desc>
